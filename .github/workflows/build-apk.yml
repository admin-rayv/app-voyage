name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write # publication des Releases (tags v*)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-voyage-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Sur un tag vX.Y.Z: publier une Release avec l'APK téléchargeable
      # sans compte GitHub. Le nom d'asset stable "app-voyage.apk" rend
      # l'URL .../releases/latest/download/app-voyage.apk permanente
      # (→ QR code imprimable qui pointe toujours vers la dernière version).
      - name: Préparer l'asset de release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp build/app/outputs/flutter-apk/app-release.apk app-voyage.apk

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app-voyage.apk
          generate_release_notes: true
