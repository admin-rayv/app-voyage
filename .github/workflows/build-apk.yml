name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de release (ex: v0.6.0) — vide = build simple"
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write # publication des Releases (tags v*)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Le contexte `secrets` n'est pas disponible dans les `if` de steps —
      # on projette sa présence dans une variable d'environnement.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Signature release (voir docs/DISTRIBUTION.md). Tant que les secrets
      # n'existent pas, l'APK reste signé en debug — rien ne casse.
      - name: Configurer la signature release
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "Signature release configurée."

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-voyage-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Sur un tag vX.Y.Z: publier une Release avec l'APK téléchargeable
      # sans compte GitHub. Le nom d'asset stable "app-voyage.apk" rend
      # l'URL .../releases/latest/download/app-voyage.apk permanente
      # (→ QR code imprimable qui pointe toujours vers la dernière version).
      - name: Préparer l'asset de release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: cp build/app/outputs/flutter-apk/app-release.apk app-voyage.apk

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # En dispatch manuel, l'action crée le tag au commit courant.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: app-voyage.apk
          generate_release_notes: true
